<!DOCTYPE html>
<html>
<head>
  <title>Student Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #4f46e5;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 20px; }
    header span { font-size: 14px; }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #64748b;
      font-size: 16px;
      margin-bottom: 40px;
    }

    .cards {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: white;
      width: 240px;
      padding: 30px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-decoration: none;
      color: #1e293b;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .card .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 6px;
      color: #4f46e5;
    }

    .card p {
      font-size: 13px;
      color: #64748b;
    }

    footer {
      background: #1e293b;
      color: #cbd5e1;
      text-align: center;
      padding: 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎓 Student Management System</h1>
    <span>Welcome</span>
  </header>

  <section class="hero">
    <h2>Welcome to the Student Portal</h2>
    <p>Please choose an option below to continue</p>

    <div class="cards">
      <a href="admin.html" class="card">
        <div class="icon">🛠️</div>
        <h3>Admin</h3>
        <p>Manage students, attendance and records</p>
      </a>

      <a href="user.html" class="card">
        <div class="icon">👨‍🎓</div>
        <h3>User</h3>
        <p>View student details and attendance</p>
      </a>
    </div>
  </section>

  <footer>
    © 2026 Student Management System
  </footer>

</body>
</html>
