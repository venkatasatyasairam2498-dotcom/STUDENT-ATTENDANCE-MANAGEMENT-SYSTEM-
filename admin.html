<!DOCTYPE html>
<html>
<head>
  <title>Admin - Student Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #1e293b;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 5px;
    }

    .sub {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .box {
      max-width: 750px;
      margin: 0 auto 20px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .box h2 {
      font-size: 16px;
      color: #4f46e5;
      margin-bottom: 12px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    input, button, select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin: 4px 2px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }

    .del {
      background: #ef4444;
      padding: 5px 10px;
      font-size: 13px;
    }
    .del:hover { background: #dc2626; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th { background: #f0f0f0; }

    .p { background: #10b981; }
    .a { background: #ef4444; }
    .p:hover { background: #047857; }
    .a:hover { background: #b91c1c; }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
    }
    .back:hover { text-decoration: underline; }

    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h1>🛠️ Admin Panel</h1>
  <p class="sub">Manage students and attendance</p>

  <!-- ============ ADD STUDENT ============ -->
  <div class="box">
    <h2>Add New Student</h2>
    <input type="text" id="aId" placeholder="Student ID (e.g. 104)" />
    <input type="text" id="aName" placeholder="Name" />
    <input type="text" id="aCourse" placeholder="Course" />
    <input type="text" id="aYear" placeholder="Year" />
    <input type="number" id="aMarks" placeholder="Marks" />
    <button onclick="addStudent()">＋ Add</button>
  </div>

  <!-- ============ STUDENT LIST ============ -->
  <div class="box">
    <h2>All Students</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Course</th><th>Year</th><th>Marks</th><th>Action</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <!-- ============ ATTENDANCE ============ -->
  <div class="box">
    <h2>Mark Attendance</h2>
    <label>Date: </label>
    <input type="date" id="attDate" />
    <div class="hint">Pick a date, then mark each student.</div>

    <table>
      <thead>
        <tr>
          <th>Name</th><th>Status</th><th>Mark</th>
        </tr>
      </thead>
      <tbody id="attList"></tbody>
    </table>

    <div style="text-align:center; margin-top:12px;">
      <button onclick="saveAttendance()">💾 Save Attendance</button>
    </div>
  </div>

  <a href="index.html" class="back">← Back to Home</a>

  <script>
    // ---- Students data ----
    let students = [
      { id: "101", name: "Aarav Sharma", course: "Computer Science", year: "3rd Year", marks: 85 },
      { id: "102", name: "Priya Nair",   course: "Information Tech",  year: "2nd Year", marks: 92 },
      { id: "103", name: "Rohan Verma",  course: "Mechanical Engg",   year: "4th Year", marks: 74 }
    ];

    // ---- Attendance data: { "2026-10-15": { "101": "Present", ... } } ----
    let attendance = {};

    // ---- Today's date by default ----
    document.getElementById("attDate").valueAsDate = new Date();

    // ============ SHOW STUDENT LIST ============
    function showList() {
      let rows = "";
      students.forEach(function (s, i) {
        rows += `
          <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.course}</td>
            <td>${s.year}</td>
            <td>${s.marks}</td>
            <td><button class="del" onclick="deleteStudent(${i})">Delete</button></td>
          </tr>
        `;
      });
      document.getElementById("list").innerHTML = rows;
      showAttendance();
    }

    // ============ ADD STUDENT ============
    function addStudent() {
      const id     = document.getElementById("aId").value.trim();
      const name   = document.getElementById("aName").value.trim();
      const course = document.getElementById("aCourse").value.trim();
      const year   = document.getElementById("aYear").value.trim();
      const marks  = document.getElementById("aMarks").value.trim();

      if (id === "" || name === "" || course === "") {
        alert("Please fill ID, Name and Course at least.");
        return;
      }
      if (students.some(function (s) { return s.id === id; })) {
        alert("A student with this ID already exists.");
        return;
      }

      students.push({ id, name, course, year, marks });

      // clear inputs
      ["aId","aName","aCourse","aYear","aMarks"].forEach(function (f) {
        document.getElementById(f).value = "";
      });

      showList();
    }

    // ============ DELETE STUDENT ============
    function deleteStudent(i) {
      if (confirm("Delete " + students[i].name + "?")) {
        students.splice(i, 1);
        showList();
      }
    }

    // ============ SHOW ATTENDANCE ============
    function showAttendance() {
      const date = document.getElementById("attDate").value;
      const day  = attendance[date] || {};

      let rows = "";
      students.forEach(function (s) {
        const st = day[s.id] || "";
        rows += `
          <tr>
            <td>${s.name}</td>
            <td>${st === "" ? "—" : st}</td>
            <td>
              <button class="p" onclick="mark('${s.id}','Present')">P</button>
              <button class="a" onclick="mark('${s.id}','Absent')">A</button>
            </td>
          </tr>
        `;
      });
      document.getElementById("attList").innerHTML = rows;
    }

    // ============ MARK ONE STUDENT ============
    function mark(id, status) {
      const date = document.getElementById("attDate").value;
      if (!date) { alert("Pick a date first."); return; }

      if (!attendance[date]) attendance[date] = {};
      attendance[date][id] = status;
      showAttendance();
    }

    // ============ SAVE ATTENDANCE ============
    function saveAttendance() {
      const date = document.getElementById("attDate").value;
      if (!date) { alert("Pick a date first."); return; }
      alert("Attendance saved for " + date);
    }

    // ---- Reload attendance when date changes ----
    document.getElementById("attDate").addEventListener("change", showAttendance);

    // ---- Start ----
    showList();
  </script>

</body>
</html>
